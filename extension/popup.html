<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CareerPilot</title><link rel="stylesheet" href="popup.css"></head><body><header><span>↗</span><strong>CareerPilot</strong><small>BETA</small></header><p class="subtitle">Your next move, with less busywork.</p><div id="profile-status" class="note">Loading profile...</div><section><button id="capture">＋ Capture this job</button><button id="preview" class="secondary">Preview autofill ↗</button><button id="sync" class="secondary">↻ Sync workspace</button></section><form id="job-editor" hidden><h3>Review captured job</h3><label>Job title<input name="title" required></label><label>Company<input name="company" required></label><label>Location<input name="location"></label><label>URL<input name="url" type="url"></label><label>Description<textarea name="description" rows="6" required></textarea></label><button>Save captured job</button></form><section id="mapping" hidden><h3>Review recognized fields</h3><div id="field-list"></div><p class="note">Only empty, visible fields are filled. Review all answers before submitting.</p><button id="apply">Fill reviewed fields</button></section><p id="message" role="status" aria-live="polite"></p><footer><a href="http://127.0.0.1:4173" target="_blank" rel="noopener">Open local workspace ↗</a><small>Nothing is submitted automatically.</small></footer><script src="page-tools.js"></script><script src="popup.js"></script></body></html>
